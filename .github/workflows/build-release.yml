name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version to release (e.g. 1.2.3 or 1.2.3-beta.1). Leave blank to use version from .csproj.'
        required: false
        default: ''
      prerelease:
        description: 'Force pre-release (auto-detected when version contains hyphen if unchecked)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # - name: Setup .NET 10
      #   uses: actions/setup-dotnet@v5
      #   with:
      #     dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Tag push: version is already in the tag name, e.g. v0.0.2 or v0.11.0-beta.1
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            echo "Using tag version: $VERSION"
          elif [ -n "${{ github.event.inputs.version_override }}" ]; then
            # Manual run with explicit override
            VERSION="${{ github.event.inputs.version_override }}"
            echo "Using override version: $VERSION"
          else
            # Manual run with no override: fall back to .csproj
            VERSION=$(dotnet msbuild src/AppPilot.csproj -getProperty:Version -nologo 2>/dev/null | tr -d '[:space:]')
            echo "Using .csproj version: $VERSION"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

          # Detect pre-release (SemVer hyphen, e.g. 1.0.0-beta.1 / 1.0.0-rc.1)
          # Manual workflow_dispatch `prerelease` input forces pre-release when checked.
          if [ "${{ github.event.inputs.prerelease }}" = "true" ] || [[ "$VERSION" == *"-"* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV
          echo "prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Pre-release: $IS_PRERELEASE"

      - name: Publish single-file framework-dependent exe
        run: |
          dotnet publish src/AppPilot.csproj \
            --configuration Release \
            --runtime win-x64 \
            --no-self-contained \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:EnableWindowsTargeting=true \
            --output publish/build

      - name: Bundle artifact
        run: |
          mkdir -p publish/artifact
          cp publish/build/AppPilot.exe publish/artifact/AppPilot.exe
          cp src/AppData.example.json publish/artifact/AppData.example.json
          cd publish/artifact
          zip -j ../../AppPilot-v${{ env.VERSION }}-win-x64.zip AppPilot.exe AppData.example.json

      # softprops/action-gh-release automatically creates the release if the tag
      # does not exist, or updates it (replacing assets) if it already does.
      # `prerelease` is auto-detected from the version (contains '-') or forced via workflow_dispatch.
      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AppPilot v${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          files: AppPilot-v${{ env.VERSION }}-win-x64.zip
